spring.application.name=smarturban-backend
server.port=${PORT:8080}

# MySQL Database Configuration Placeholders
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smarturban_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret & Expiration Placeholder
jwt.secret=${JWT_SECRET:smarturban_jwt_secret_key_for_academic_project_demonstration_2026}
jwt.expiration=${JWT_EXPIRATION:86400000}
